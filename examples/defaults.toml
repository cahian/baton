# Copy to ~/.config/baton/defaults.toml. These [agents.*] tables apply under every goal, and a
# goal file may override any of them except the three budget settings, which only live here.

# Long-term memory: baton drives a private ai-memory instance (see the README). Without the
# binary on PATH nothing happens and rounds run as before. `BATON_MEMORY=off` turns it off everywhere.
[memory]
enabled = true
bin = "ai-memory"      # a name on PATH, or a path
port = 18778           # 1024-65535; the instance is its own, not ai-memory's default 49374
recall_chars = 6000    # most memory put in one prompt, 0-20000; 0 stops recall, recording goes on

[agents.claude_api]
enabled = true
model = "claude-opus-5-5"
effort = "medium"
build_model = "claude-sonnet-5-5"   # the phases' working tier (plan and review use `model`)
build_effort = "high"
# One budget for every goal, because they all spend the same Console credit.
monthly_budget_usd = 200   # what the organization holds
reserve_pct = 10           # kept back; the spend ceiling is 200 - 10% = 180
budget_reset_day = 1       # day of the month the period starts, 00:00 UTC
round_budget_usd = 5       # most one round may spend (a killed round counts all of it)
reserve = false            # true: Claude waits for the others, and runs only while they are out
turn_max_s = 18000         # a turn ends after this long (every agent has it): 5 hours
turn_budget_usd = 50       # or after this much spent in the turn
goal_budget_usd = 150      # after this much in one goal, Claude is left out until the goal changes
key_file = "~/.config/baton/anthropic.key"   # must be a regular file, mode 600
admin_key_file = ""        # optional: an Admin API key file, to cross-check spend with the Console

[agents.antigravity]
enabled = true
model = "gemini-4-argon-medium"
build_model = "gemini-3.8-flash-high"   # must start with gemini-
threshold_pct = 90
poll_s = 30
turn_max_s = 18000

[agents.codex]
enabled = true
model = "gpt-6.1-sol"
effort = "medium"
build_model = "gpt-6.1-terra"
build_effort = "high"
threshold_pct = 90
poll_s = 15
turn_max_s = 18000

# Superpowers is optional and used only when a goal sets `phases = true`.
# Leave `dir` empty: only the official Claude Code plugin install and that clone are found
# automatically. An install anywhere else needs `dir`. Only this file may set it: a goal file or a repository's baton.toml cannot.
[superpowers]
dir = ""
