name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The private-data scan reads every commit message.
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
      - name: Python 3.12
        run: uv python install 3.12
      - name: Install
        run: uv sync --python 3.12
      - name: Lint
        run: uv run ruff check .
      - name: Format
        run: uv run ruff format --check .
      - name: Tests
        run: uv run pytest -q
      - name: Private data scan
        run: uv run python scripts/check_private.py
