[project]
name = "baton"
version = "0.1.0"
description = "Relay one coding goal across subscription coding CLIs without spending paid credits."
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
baton = "baton.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-timeout>=2.4.0",
    "ruff>=0.8",
]

[build-system]
requires = ["uv_build>=0.8,<0.13"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 120

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
