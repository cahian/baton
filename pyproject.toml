[project]
name = "baton"
version = "0.1.0"
description = "Relay one coding goal across subscription coding CLIs without spending paid credits."
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["textual>=1.0"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.8"]

[build-system]
requires = ["uv_build>=0.8,<0.13"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
